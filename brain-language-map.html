<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mu:#5b6478;--bd:#ddd8cc;--ac:#3b5bdb;--br:#f3d9d0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;background:linear-gradient(90deg,#f76707,#e64980,#7048e8);-webkit-background-clip:text;background-clip:text;color:transparent}header p{margin:2px 0 0;color:var(--mu);font-size:.9rem}
#lang{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:.95rem}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding:0 20px 24px;max-width:1150px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
svg{width:100%;height:auto;display:block}
.reg{cursor:pointer;transition:all .2s;opacity:.92;stroke:#fff;stroke-width:2;filter:saturate(1.1)}
@keyframes pu{0%,100%{filter:drop-shadow(0 0 3px currentColor) saturate(1.6)}50%{filter:drop-shadow(0 0 16px currentColor) saturate(2)}}
.reg.on{filter:drop-shadow(0 0 14px #fff) saturate(2)!important}
#tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:5px 10px;border-radius:8px;font-size:.82rem;display:none;z-index:9}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar button{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:#fff;font-size:.9rem}
#bj{background:#1c7ed6}#bq{background:#2b8a3e}
#qb{margin-top:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,#12b886 15%,transparent);display:none;font-size:.95rem}
.reg:hover,.reg.on{opacity:1;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;transform:scale(1.06)}
.lobe{stroke:#a08a80;stroke-width:1.5}
.sul{fill:none;stroke:#8d766c;stroke-width:1.6;opacity:.45;stroke-linecap:round}
.lab{font-size:12px;fill:var(--mu);pointer-events:none}
#info h2{margin:0 0 2px;font-size:1.2rem}
.tag{display:inline-block;font-size:.75rem;background:var(--br);padding:2px 10px;border-radius:99px;margin-bottom:8px}
.box{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.93rem;border:1px solid var(--bd)}
.box b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin-bottom:2px}
.kid{background:color-mix(in srgb,var(--ac) 12%,transparent)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer}
#chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hint{color:var(--mu);font-size:.85rem;text-align:center;margin:6px 0 0}

body{background:linear-gradient(160deg,#0b1f3a 0%,#12325c 55%,#1b4a7a 100%) fixed;min-height:100vh}
header p{color:#e7f0ff!important}
h1{background:none!important;-webkit-background-clip:initial!important;color:#fff!important;text-shadow:none;font-size:1.7rem!important;letter-spacing:.3px}

.box{border-width:2px}.kid{background:#e7f0ff!important;border-color:#a5c4f3!important}

footer{text-align:center;color:#e7f0ff;padding:0 0 20px;font-size:.85rem;display:flex;gap:8px;justify-content:center;align-items:center}

const R={
broca:{c:"#e8590c",s:'<ellipse cx="235" cy="272" rx="46" ry="28"/>',
el:{n:"Περιοχή του Broca",l:"Κάτω μετωπιαία έλικα (BA 44/45)",r:"Η «κουζίνα» του λόγου: οργανώνει τη σύνταξη, συνθέτει προτάσεις και προγραμματίζει τις κινήσεις της ομιλίας. Συμμετέχει στην επεξεργασία σύνθετης σύνταξης και στη φωνολογική οργάνωση.",k:"Όταν λες μια ολόκληρη πρόταση, εδώ τακτοποιούνται οι λέξεις σαν τουβλάκια στη σωστή σειρά!",d:"Βλάβη → αφασία Broca: ομιλία αργή, κοπιώδης, με τηλεγραφική σύνταξη, αλλά η κατανόηση διατηρείται σε μεγάλο βαθμό."},
en:{n:"Broca's area",l:"Inferior frontal gyrus (BA 44/45)",r:"The speech 'kitchen': organizes syntax, builds sentences and plans the movements of speech. Involved in complex syntax and phonological organization.",k:"When you say a whole sentence, this is where words get lined up like building blocks in the right order!",d:"Damage → Broca's aphasia: slow, effortful, telegraphic speech, but comprehension is largely preserved."}},

const EN={
wern:{n:"Wernicke's area",l:"Posterior superior temporal gyrus (BA 22)",r:"The hub for understanding spoken language: links sounds to meaning and word forms (lexicon and semantics).",k:"This is where you understand what others say. It turns sounds into meaning!",d:"Damage → Wernicke's aphasia: fluent but meaningless speech with invented words, and severe comprehension problems."},
aud:{n:"Primary auditory cortex",l:"Heschl's gyrus (BA 41/42)",r:"The first cortical stop for sound. It analyses frequency and timing, i.e. the phonemes of speech, before passing them to Wernicke's area.",k:"The brain's 'ears': everything you hear arrives here first!",d:"Damage → trouble telling sounds apart; in the extreme, 'pure word deafness'."},
arc:{n:"Arcuate fasciculus",l:"White matter, links Wernicke ↔ Broca",r:"A bundle of nerve fibres, the language 'highway'. It lets you repeat what you hear and links comprehension to production.",k:"A cable that carries messages from 'I understand' to 'I speak'!",d:"Damage → conduction aphasia: good comprehension and fluency, but cannot repeat words and phrases."},
smg:{n:"Supramarginal gyrus",l:"Parietal lobe (BA 40)",r:"Phonological working memory and converting sounds into pronunciation. Helps you hold a word in mind.",k:"The notepad that holds a word until you say or write it!",d:"Damage → phonemic paraphasias (sound substitutions)."},
ang:{n:"Angular gyrus",l:"Parieto-occipital area (BA 39)",r:"Joins written, auditory and meaning information. Crucial for reading, writing and semantic integration.",k:"The bridge joining letters, sounds and meaning when you read!",d:"Damage → alexia with agraphia and naming difficulty."},
